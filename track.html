<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Tracker — ScholarPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="app-sidebar" aria-label="Student Navigation">
      <div class="sidebar-header">
        <a href="index.html" class="navbar-brand">
          <div class="brand-logo" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
          </div>
          <span class="brand-name">Scholar<span class="text-gradient">Path</span></span>
        </a>
      </div>

      <nav class="sidebar-nav" style="padding: 0 0.75rem; display:flex; flex-direction:column; gap:0.35rem;">
        <div class="sidebar-section-label" style="font-size:var(--text-xs); text-transform:uppercase; color:var(--text-muted); font-weight:700; padding: 0.5rem 0.5rem 0.25rem 0.5rem;">Menu</div>
        
        <a href="dashboard.html" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Dashboard</span>
        </a>

        <a href="scholarships.html" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span>Browse Scholarships</span>
        </a>

        <a href="track.html" class="sidebar-link active" aria-current="page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          <span>My Applications</span>
        </a>

        <a href="scholarships.html?bookmarks=true" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
          <span>Saved Bookmarks</span>
        </a>

        <div class="sidebar-section-label" style="font-size:var(--text-xs); text-transform:uppercase; color:var(--text-muted); font-weight:700; padding: 1.25rem 0.5rem 0.25rem 0.5rem;">Account</div>

        <a href="index.html" class="sidebar-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
          <span>Home Portal</span>
        </a>

        <a href="javascript:void(0)" onclick="Auth.logout()" class="sidebar-link" style="color:var(--danger);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sign Out</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content" style="flex:1; overflow-y:auto; background:var(--bg);">
      
      <!-- Topbar Header -->
      <header class="topbar" style="background:var(--surface); border-bottom:1px solid var(--border); padding:0.75rem 1.5rem; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:30;">
        <div style="display:flex; align-items:center; gap:1rem;">
          <button class="btn btn-icon btn-outline d-md-none" id="app-sidebar-toggle"
                  aria-label="Toggle navigation menu" aria-controls="app-sidebar" aria-expanded="false" onclick="toggleAppSidebar()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div>
            <h2 style="font-size:1.25rem; margin:0;">Application Status Tracker</h2>
            <small class="text-muted">Track the application statuses and milestones recorded in your profile</small>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:1rem;">
          <a href="scholarships.html" class="btn btn-primary btn-sm">+ Apply New Grant</a>
          <button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle theme">
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </div>
      </header>

      <div class="container" style="padding: 1.75rem 1.5rem;">
        
        <!-- Filter Tabs -->
        <div style="display:flex; gap:0.5rem; margin-bottom:1.75rem; border-bottom:1px solid var(--border); padding-bottom:0.75rem; overflow-x:auto;">
          <button class="btn btn-sm btn-primary track-filter-btn" data-filter="all" data-label="All Applications">All Applications</button>
          <button class="btn btn-sm btn-ghost track-filter-btn" data-filter="Submitted" data-label="Submitted">Submitted</button>
          <button class="btn btn-sm btn-ghost track-filter-btn" data-filter="Under Review" data-label="Under Review">Under Review</button>
          <button class="btn btn-sm btn-ghost track-filter-btn" data-filter="Verified" data-label="Verified">Verified</button>
          <button class="btn btn-sm btn-ghost track-filter-btn" data-filter="Approved" data-label="Approved / Sanctioned">Approved / Sanctioned</button>
          <button class="btn btn-sm btn-ghost track-filter-btn" data-filter="Rejected" data-label="Rejected">Rejected</button>
        </div>

        <!-- Applications Cards List -->
        <div id="applications-tracker-container" style="display:flex; flex-direction:column; gap:1.75rem;">
          <!-- Dynamically populated -->
        </div>

      </div>
    </main>
    <div class="sidebar-overlay" id="app-sidebar-overlay" aria-hidden="true" onclick="closeAppSidebar()"></div>
  </div>

  <!-- Printable Application Receipt Modal -->
  <div class="modal-overlay" id="receipt-modal" hidden role="dialog" aria-modal="true">
    <div class="modal-dialog modal-lg" style="max-width:700px; background:#fff; color:#000;">
      <div id="receipt-modal-content">
        <!-- Rendered by showReceiptModal -->
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Core Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>

  <script>
    let activeFilter = 'all';

    function toggleAppSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      const overlay = document.getElementById('app-sidebar-overlay');
      const toggle = document.getElementById('app-sidebar-toggle');
      const open = sidebar.classList.toggle('open');
      overlay.classList.toggle('show', open);
      toggle.setAttribute('aria-expanded', String(open));
    }

    function closeAppSidebar() {
      document.getElementById('app-sidebar').classList.remove('open');
      document.getElementById('app-sidebar-overlay').classList.remove('show');
      document.getElementById('app-sidebar-toggle').setAttribute('aria-expanded', 'false');
    }

    document.addEventListener('DOMContentLoaded', () => {
      Auth.requireAuth();
      Auth.requireStudent();
      UI.initTheme();

      const user = Auth.getCurrentUser();
      if (!user || user.role !== 'student') return;
      renderTrackerList(user);

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeAppSidebar();
      });

      // Filter tabs handler
      document.querySelectorAll('.track-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.track-filter-btn').forEach(b => {
            b.classList.remove('btn-primary');
            b.classList.add('btn-ghost');
          });

          btn.classList.add('btn-primary');
          btn.classList.remove('btn-ghost');
          activeFilter = btn.getAttribute('data-filter') || 'all';
          renderTrackerList(user);
        });
      });
    });

    function renderTrackerList(user) {
      const container = document.getElementById('applications-tracker-container');
      if (!container || !user) return;

      const allApps = Storage.getApplications(user.id);
      document.querySelectorAll('.track-filter-btn').forEach(btn => {
        const status = btn.getAttribute('data-filter');
        const count = status === 'all'
          ? allApps.length
          : allApps.filter(app => (app.status || 'Submitted') === status).length;
        btn.textContent = `${btn.getAttribute('data-label')} (${count})`;
      });

      let apps = allApps;
      if (activeFilter !== 'all') {
        apps = apps.filter(a => (a.status || 'Submitted') === activeFilter);
      }

      if (apps.length === 0) {
        container.innerHTML = `
          <div class="card glass-card text-center" style="padding:3.5rem 1.5rem;">
            <div style="font-size:2.5rem; margin-bottom:1rem;">📂</div>
            <h3 style="margin-bottom:0.5rem;">No Applications Found</h3>
            <p class="text-muted" style="max-width:400px; margin:0 auto 1.5rem auto;">You don't have any applications matching this status filter.</p>
            <a href="scholarships.html" class="btn btn-primary">Browse Scholarship Listings →</a>
          </div>
        `;
        return;
      }

      container.innerHTML = apps.map(app => {
        const status = app.status || 'Submitted';
        const finalStep = status === 'Rejected' ? 'Rejected' : 'Approved';
        const timeline = app.timeline || [
          { step: 'Submitted', done: true, date: app.submittedAt || null },
          { step: 'Under Review', done: ['Under Review', 'Verified', 'Approved', 'Rejected'].includes(status), date: null },
          { step: 'Verified', done: ['Verified', 'Approved'].includes(status), date: null },
          { step: finalStep, done: ['Approved', 'Rejected'].includes(status), date: null }
        ];

        return `
          <div class="card glass-card" style="padding:1.75rem 2rem; border-radius:var(--radius-xl); border:1px solid var(--border);">
            
            <!-- Card Header -->
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
              <div>
                <span class="badge font-mono" style="background:rgba(79, 70, 229, 0.1); color:var(--primary); font-weight:700; margin-bottom:0.35rem;">${app.id}</span>
                <h3 style="font-size:1.35rem; margin:0 0 0.25rem 0; color:var(--heading);">${app.scholarshipName}</h3>
                <div class="text-muted" style="font-size:var(--text-sm);">Provider: ${app.provider} • Submitted on ${UI.formatDate(app.submittedAt)}</div>
              </div>

              <div style="text-align:right;">
                <span class="badge ${getStatusBadge(status)}" style="font-size:0.9rem; padding:0.4rem 0.8rem;">
                  ${status}
                </span>
                <div style="font-size:1.15rem; font-weight:700; color:var(--success); margin-top:0.35rem;">
                  ${app.amountDisplay || `₹${app.amount}`}
                </div>
              </div>
            </div>

            <!-- Milestone Progress Tracker Bar -->
            <div class="timeline-bar" style="margin: 2rem 0; position:relative;">
              <div style="display:flex; justify-content:space-between; position:relative; z-index:2;">
                ${timeline.map((step, idx) => {
                  const isCurrent = step.step === status;
                  return `
                    <div style="display:flex; flex-direction:column; align-items:center; flex:1; text-align:center;">
                      <div style="width:36px; height:36px; border-radius:50%; background:${step.done ? 'var(--success)' : (isCurrent ? 'var(--primary)' : 'var(--border)')}; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.9rem; box-shadow:${isCurrent ? '0 0 0 4px rgba(79, 70, 229, 0.2)' : 'none'};">
                        ${step.done ? '✓' : (idx + 1)}
                      </div>
                      <div style="font-weight:600; font-size:var(--text-xs); color:${step.done || isCurrent ? 'var(--heading)' : 'var(--text-muted)'}; margin-top:0.5rem;">
                        ${step.step}
                      </div>
                      <div class="text-muted" style="font-size:0.75rem;">${step.date ? UI.formatDate(step.date) : step.done ? 'Date not recorded' : 'Pending'}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Remarks Banner -->
            <div style="background:var(--bg-alt); padding:1rem 1.25rem; border-radius:var(--radius-lg); border-left:4px solid ${status === 'Approved' ? 'var(--success)' : (status === 'Rejected' ? 'var(--danger)' : 'var(--primary)')}; margin-bottom:1.25rem;">
              <strong style="font-size:var(--text-xs); text-transform:uppercase; color:var(--text-muted); display:block; margin-bottom:2px;">Nodal Officer Remarks:</strong>
              <div style="font-size:var(--text-sm); color:var(--text);">${app.remarks || 'Application under institutional review.'}</div>
            </div>

            <!-- Card Actions -->
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; border-top:1px solid var(--border); padding-top:1rem;">
              <div style="font-size:var(--text-xs); color:var(--text-muted);">
                Institution: <strong>${app.academicDetails?.college || app.institution || 'Not recorded'}</strong>
              </div>
              <div style="display:flex; gap:0.5rem;">
                <button class="btn btn-sm btn-outline" onclick="printApplicationReceipt('${app.id}')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                  Print Application Summary
                </button>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function getStatusBadge(status) {
      switch (status) {
        case 'Approved': return 'badge-success';
        case 'Verified': return 'badge-primary';
        case 'Under Review': return 'badge-warning';
        case 'Rejected': return 'badge-danger';
        default: return 'badge-info';
      }
    }

    function printApplicationReceipt(appId) {
      const app = Storage.getApplications().find(a => a.id === appId);
      if (!app) return;

      const modal = document.getElementById('receipt-modal');
      const content = document.getElementById('receipt-modal-content');

      content.innerHTML = `
        <div style="padding:2.5rem; font-family:'Inter', sans-serif; color:#1e293b;">
          
          <!-- Receipt Header -->
          <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #4f46e5; padding-bottom:1.5rem; margin-bottom:2rem;">
            <div>
              <h2 style="margin:0; color:#4f46e5; font-size:1.75rem;">ScholarPath</h2>
              <div style="font-size:0.85rem; color:#64748b;">Centralized University Scholarship Discovery & Application Portal</div>
              <div style="font-size:0.8rem; color:#64748b; margin-top:2px;">Application tracking summary</div>
            </div>
            <div style="text-align:right;">
              <span style="display:inline-block; padding:4px 8px; background:#e0e7ff; color:#3730a3; border-radius:4px; font-weight:700; font-size:0.85rem;">APPLICATION SUMMARY</span>
              <div style="font-family:monospace; font-weight:700; font-size:1.1rem; margin-top:4px;">${app.id}</div>
              <div style="font-size:0.8rem; color:#64748b;">Date: ${app.submittedAt ? UI.formatDate(app.submittedAt) : 'Not recorded'}</div>
            </div>
          </div>

          <!-- Student & Institution Details -->
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:2rem; font-size:0.9rem;">
            <div>
              <strong style="display:block; text-transform:uppercase; font-size:0.75rem; color:#64748b; margin-bottom:4px;">Applicant Information</strong>
              <div><strong>Name:</strong> ${app.userName || 'Not recorded'}</div>
              <div><strong>Email:</strong> ${app.userEmail || 'Not recorded'}</div>
              <div><strong>Mobile:</strong> ${app.userPhone || 'Not recorded'}</div>
              <div><strong>Course:</strong> ${app.academicDetails?.course || app.course || 'Not recorded'}</div>
            </div>
            <div>
              <strong style="display:block; text-transform:uppercase; font-size:0.75rem; color:#64748b; margin-bottom:4px;">Institution Details</strong>
              <div><strong>College:</strong> ${app.academicDetails?.college || app.institution || 'Not recorded'}</div>
              <div><strong>Department:</strong> ${app.department || 'Not recorded'}</div>
              <div><strong>State / Domicile:</strong> ${app.state || 'Not recorded'}</div>
              <div><strong>Current CGPA:</strong> ${app.academicDetails?.cgpa ?? app.cgpa ?? 'Not recorded'}</div>
            </div>
          </div>

          <!-- Scholarship Sanction Details -->
          <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:1.25rem; margin-bottom:2rem;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <strong style="font-size:1.1rem; color:#0f172a;">${app.scholarshipName}</strong>
                <div style="font-size:0.85rem; color:#64748b;">Sanctioning Agency: ${app.provider}</div>
              </div>
              <div style="text-align:right;">
                <span style="font-size:1.35rem; font-weight:700; color:#10b981;">${app.amountDisplay || `₹${app.amount}`}</span>
                <div style="font-size:0.75rem; color:#64748b;">Annual Grant Value</div>
              </div>
            </div>
          </div>

          <!-- Current Milestone Status -->
          <div style="margin-bottom:2.5rem; font-size:0.9rem;">
            <strong style="display:block; text-transform:uppercase; font-size:0.75rem; color:#64748b; margin-bottom:6px;">Current Approval Milestone</strong>
            <div style="padding:0.75rem 1rem; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:6px; color:#065f46;">
              <strong>Status: ${app.status || 'Submitted'}</strong> — ${app.remarks || 'No remarks recorded.'}
            </div>
          </div>

          <div style="border-top:1px dashed #cbd5e1; padding-top:1rem; margin-top:1.5rem; color:#64748b; font-size:0.8rem;">
            This summary is for your records only. Use the official scheme portal for official application documents and status updates.
          </div>

          <!-- Modal Action Buttons (Hidden when printed) -->
          <div class="no-print" style="margin-top:2.5rem; display:flex; justify-content:flex-end; gap:0.75rem; border-top:1px solid #e2e8f0; padding-top:1.5rem;">
            <button class="btn btn-outline" onclick="document.getElementById('receipt-modal').hidden = true">Close</button>
            <button class="btn btn-primary" onclick="window.print()">Print Application Summary</button>
          </div>

        </div>
      `;

      modal.hidden = false;
    }
  </script>
</body>
</html>
